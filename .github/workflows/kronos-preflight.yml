name: Kronos checkpoint preflight

on:
  pull_request:
    paths:
      - "config/models.json"
      - "src/commodity/kronos.py"
      - "scripts/models/preflight_kronos_checkpoint.py"
      - "scripts/checks/hash_kronos_implementation.py"
      - "tests/models/test_kronos.py"
      - "tests/models/test_kronos_runtime.py"
      - ".github/workflows/kronos-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create checkout-local virtual environment
        run: python -m venv .venv
      - name: Install preflight dependency
        run: .venv/bin/python -m pip install --disable-pip-version-check "huggingface-hub>=0.33,<1"
      - name: Resolve and hash exact pinned snapshots
        run: >-
          .venv/bin/python scripts/models/preflight_kronos_checkpoint.py
          --cache-dir "${{ runner.temp }}/kronos-cache"
          --output "${{ runner.temp }}/kronos-preflight.json"
      - name: Hash exact result-affecting implementation sources
        run: .venv/bin/python scripts/checks/hash_kronos_implementation.py
