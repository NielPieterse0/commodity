name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Public repository hygiene
        run: python scripts/check_public_hygiene.py
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Whitespace
        run: git diff --check HEAD^1 HEAD
