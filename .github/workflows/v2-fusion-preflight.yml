name: V2 fusion preflight

on:
  pull_request:
    paths:
      - "docs/development/v2-fusion-challenger/**"
      - "src/commodity/v2_fusion.py"
      - "tests/test_v2_fusion.py"
      - ".github/workflows/v2-fusion-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps
      - name: Verify frozen fusion contract
        run: python -m pytest -q tests/test_v2_fusion.py
      - name: Verify no empirical artifact namespace was created
        run: test ! -e artifacts/v2/v2-84-kronos-indicator-fusion
