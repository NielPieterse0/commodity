name: V2 activation freeze preflight

on:
  pull_request:
    paths:
      - "config/experiment_candidates.json"
      - "docs/development/v2-activation-preregistration/**"
      - "tests/test_v2_activation_refreeze.py"
      - ".github/workflows/v2-activation-freeze-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps
      - name: Verify frozen V2 activation identities
        run: python -m pytest -q tests/test_v2_activation_refreeze.py
      - name: Emit frozen identity hashes
        run: |
          sha256sum config/experiment_candidates.json
          sha256sum docs/development/v2-activation-preregistration/multiplicity-families.json
